# 自動投稿の編集方針
# 昔ルアー釣りをしていた会社員が、週末に無理なく再開するための実践記事だけを出す。
auto_publish:
  description: "週末半日でルアー釣りを再開する実践記事。投資・仮想通貨・ITは出さない。"
  allowed_categories:
    - 釣具レビュー・比較
  weekly_quota:
