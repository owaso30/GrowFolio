trend_research:
  news_queries:
    - シーバス シーズン ショア
    - バス釣り 週末 半日
    - エギング 季節 ショア
    - アジング タックル ライト
    - メバリング 堤防 夜
    - 管理釣り場 ルアー エリアトラウト
    - ルアー タックル ブランク 再開
    - 釣り ライフジャケット ルール
    - ショアジギング 会社員 時間
    - スピニングリール メンテナンス
  suggest_seeds:
    - シーバス 半日 タックル 最小
    - ブランク バス釣り 再開 ロッド
    - 週末 堤防 アジング 時間
    - 管理釣り場 ルアー 持参 リスト
    - しまい込んだ リール 点検 ポイント
    - エギング 初めて 再開 エギ 数
    - 会社員 早朝 シーバス 移動時間
    - PEライン 劣化 見分け 交換
    - ライフジャケット ショア 義務 確認
    - ワーム 保管 夏 溶ける

blue_ocean:
  min_chars: 12
  min_words: 3
  max_words: 10
  prefer_words_min: 3
  reject_raw_news_headlines: true
  reject_high_competition: true
  use_serp_related: true
  max_expansion_per_seed: 8
  trend_bonus: 10
  trend_focus_bonus: 12
  news_focus_bonus: 8
  specificity_bonus: 25
  long_tail_bonus: 10
  intent_modifier_bonus: 6
  high_intent_bonus: 8
  head_term_penalty: 30
  procedure_penalty: 0
  generic_penalty: 35
  reputation_penalty: 35
  preferred_intents: [A, C, E, F]
  head_terms:
    - 釣り
    - ルアー
    - バス
    - タックル
  intent_modifiers:
    - 再開
    - 半日
    - 週末
    - 点検
    - 比較
    - 最小
    - 足りる
    - 持っていく
    - 保管
    - 安全
    - 規則
  expansion_modifiers:
    - 半日 タックル
    - ブランク 再開
    - 会社員 週末
    - 最小 セット
    - 点検 ポイント
    - 持っていく リスト
    - 時間 目安
    - 安全 規則
  news_headline_markers:
    - 速報
    - 発表
    - 推移
    - が発表
  reject_patterns:
    - "^[ぁ-んァ-ンa-zA-Z0-9]{1,6}$"
  serp:
    min_opportunity_ratio: 0.25
    blue_ocean_serp_bonus: 15
    red_ocean_serp_penalty: 20
    red_ocean_authority_threshold: 6
    opportunity_domain_bonus: 4
    authority_domain_penalty: 3
    authority_domains:
      - wikipedia.org
      - yahoo.co.jp
      - google.com
      - go.jp
      - amazon.co.jp
      - rakuten.co.jp
    opportunity_domains:
      - note.com
      - hatena
      - ameblo
      - wordpress
      - blogspot
      - livedoor
      - fc2.com
      - personal

intent_categories:
  A: {name: 失敗しやすい点, intent_depth: 5, conversion: 4}
  B: {name: 規則・安全, intent_depth: 4, conversion: 3}
  C: {name: 半日の段取り, intent_depth: 5, conversion: 4}
  D: {name: 釣具レビュー・比較, intent_depth: 4, conversion: 5}
  E: {name: 再開の記録, intent_depth: 3, conversion: 3}
  F: {name: 基本の見直し, intent_depth: 3, conversion: 3}
  G: {name: 季節の条件, intent_depth: 4, conversion: 3}
  H: {name: 釣行記録, intent_depth: 4, conversion: 3}

editorial:
  trend_research: true
  max_trend_headlines: 8
  require_fact_opinion_split: false
  require_multi_source: false
  min_reference_sources: 3
  fact_section_heading: "現場の条件（事実）"
  opinion_section_heading: "週末にやるなら（判断）"
  fact_label: "【事実】"
  fact_badge_text: "事実"
  opinion_label: "【考察】"
  opinion_badge_text: "考察"
  source_section_heading: "参考・関連情報"
  images:
    prefer_brand_logo: false
    avoid_ai_aesthetic: true
    flux_style: "quiet realistic photo of weekend shore lure fishing, natural light, practical tackle, no neon, no readable text, no logos, no close-up faces"
  emphasis:
    min_cap_boxes: 2
    min_mark_highlights: 3
