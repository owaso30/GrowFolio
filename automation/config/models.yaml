# LLM / 画像生成プロバイダ（環境変数で上書き可）

llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 8192
  temperature: 0.65

images:
  provider: fal
  featured_model: fal-ai/flux-2-pro
  body_model: fal-ai/flux-2-pro
  prompt_suffix: ". Photorealistic quiet photograph for a weekend lure-fishing blog. Composition, always the same: horizontal frame, the tackle subject sits in the lower-left third and is tack-sharp, a Japanese rocky shore or small harbor behind it is softly blurred, camera at standing height as if the angler set the gear on the rock and stepped back one pace. Color: cool blue-gray water, warm low sun on the tackle, muted, never neon. No text, no letters, no logos, no watermarks, no borders, no graphic frames, no faces."
