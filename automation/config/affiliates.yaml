# Amazon（タックル検索）。A8 案件は config/a8_programs.yaml
# 新規記事では釣り道具以外の案件を選ばない。

affiliate_banners:
  slot_labels:
    intro: "📌 この記事を読む方におすすめ"
    mid: "💡 関連サービス・ツール"
    end: "👉 次のステップ"
  slot_default_headings:
    intro: "先に揃えておくと楽なもの"
    mid: "この記事で触れた道具"
    end: "次の釣行までに見ておくもの"
  disclaimer_note: "※当サイトはアフィリエイトプログラムに参加しています。リンクからの申込・購入により報酬が発生する場合があります。"
  styles:
    amazon:
      border: "#ea580c"
      accent: "#c2410c"
      bg: "linear-gradient(135deg,#fff7ed 0%,#fffbeb 100%)"
      badge: "Amazon"
    a8:
      border: "#059669"
      accent: "#047857"
      bg: "linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 100%)"
      badge: "PR"
    default:
      border: "#475569"
      accent: "#334155"
      bg: "linear-gradient(135deg,#f8fafc 0%,#f1f5f9 100%)"
      badge: "PR"

rakuten:
  hgc_path: "0ea62065.34400275.0ea62066.204f04c0/a26062729741_4B65SJ_5O7P9U_2HOM_6C1VM"
  a8_prefix: "https://rpx.a8.net/svt/ejp?a8mat=4B65SJ+5O7P9U+2HOM+6C1VM&rakuten=y&a8ejpredirect="

programs:
  amazon_search:
    name: Amazonアソシエイト
    description: ロッド・リール・ルアーなど、週末の釣行で使う道具の検索リンク
    tag_env: AMAZON_AFFILIATE_TAG
    url_template: "https://www.amazon.co.jp/s?k={query}&tag={tag}"
    topics:
      - ルアー
      - ロッド
      - リール
      - タックル
      - 釣り
      - ライフジャケット
      - ワーム
      - ライン
    default_anchor: 関連タックルをAmazonで探す
    default_heading: "半日で足りるタックルをAmazonで見る"
    default_teaser: "全部買い直さず、記事で触れたロッド・リール・ルアーだけをAmazonで確認できます。"
    style_key: amazon
    cta_template: |
      <a href="{url}" class="growfolio-affiliate__btn" rel="nofollow sponsored noopener" target="_blank">{anchor}</a>

a8_cta_template: |
  <a href="{url}" class="growfolio-affiliate__btn" rel="nofollow sponsored noopener" target="_blank">{anchor}</a>
